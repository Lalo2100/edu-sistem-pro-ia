<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edu.sistem Pro IA — Versión Nacional</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #334155;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; line-height: 1.5; }
    
    .container { max-width: 800px; margin: 0 auto; background: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    
    h1 { font-size: 1.5rem; color: var(--primary); margin-bottom: 8px; text-align: center; }
    .subtitle { text-align: center; font-size: 0.9rem; color: #64748b; margin-bottom: 20px; }

    /* Panel de Estado y Suscripción */
    .status-panel { background: #f1f5f9; border: 1px solid var(--border); padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .status-info { font-size: 0.95rem; font-weight: 500; color: var(--primary); }
    .btn-upgrade { background: #009ee3; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-upgrade:hover { background: #0081be; }

    /* Formulario */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: var(--primary); }
    select, input, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; background: #fff; }
    textarea { resize: vertical; min-height: 80px; }
    
    .btn-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    .btn-submit:hover { background: var(--accent-hover); }
    .btn-submit:disabled { background: var(--border); cursor: not-allowed; }

    /* Resultados y Carga */
    .loader { display: none; text-align: center; margin: 20px 0; font-weight: 600; color: var(--accent); }
    .result-box { display: none; margin-top: 24px; background: #f8fafc; border: 1px solid var(--border); padding: 20px; border-radius: 8px; white-space: pre-wrap; font-size: 0.95rem; }
    
    .error-banner { display: none; background: #fee2e2; border: 1px solid #f87171; color: #b91c1c; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-weight: 500; text-align: center; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Edu.sistem Pro IA</h1>
    <div class="subtitle">Generador Inteligente de Planificaciones y Materiales Curriculares</div>

    <!-- Panel de Plan y Consumo -->
    <div class="status-panel">
      <div class="status-info" id="status-text">Cargando estado de tu cuenta...</div>
      <button id="btn-upgrade" class="btn-upgrade" onclick="pagarPlanPro()" style="display: none;">⭐ Actualizar a Pro ($5.000)</button>
    </div>

    <!-- Alerta de Errores o Límites -->
    <div id="error-banner" class="error-banner"></div>

    <!-- Formulario Principal -->
    <form id="generation-form">
      <div class="form-group">
        <label for="provincia">Jurisdicción / Provincia</label>
        <select id="provincia" name="provincia" required>
          <option value="">Seleccioná una provincia...</option>
          <option value="Córdoba" selected>Córdoba</option>
          <option value="Buenos Aires">Buenos Aires</option>
          <option value="CABA">CABA</option>
          <option value="Santa Fe">Santa Fe</option>
          <option value="Mendoza">Mendoza</option>
          <option value="Otras">Otras Jurisdicciones</option>
        </select>
      </div>

      <div class="form-group">
        <label for="tipo">Tipo de Trabajo</label>
        <select id="tipo" name="tipo" required>
          <option value="anual">Planificación anual</option>
          <option value="secuencia">Secuencia didáctica</option>
          <option value="proyecto">Proyecto</option>
          <option value="rubrica">Rúbrica</option>
        </select>
      </div>

      <div class="form-group">
        <label for="nivel">Nivel Educativo</label>
        <input type="text" id="nivel" name="nivel" placeholder="Ej: Primario, Secundario, Inicial..." required>
      </div>

      <div class="form-group">
        <label for="grado">Grado / Curso</label>
        <input type="text" id="grado" name="grado" placeholder="Ej: 5to Grado, 3er Año..." required>
      </div>

      <div class="form-group">
        <label for="area">Área / Materia</label>
        <input type="text" id="area" name="area" placeholder="Ej: Matemáticas, Música, Lengua..." required>
      </div>

      <div class="form-group">
        <label for="tema">Tema o Eje Central</label>
        <input type="text" id="tema" name="tema" placeholder="Ej: Fracciones, El sonido y las ondas..." required>
      </div>

      <div class="form-group">
        <label for="duracion">Duración estimada (Opcional)</label>
        <input type="text" id="duracion" name="duracion" placeholder="Ej: 4 clases, 2 semanas...">
      </div>

      <div class="form-group">
        <label for="indicaciones">Indicaciones adicionales (Opcional)</label>
        <textarea id="indicaciones" name="indicaciones" placeholder="Detalles particulares que quieras incluir..."></textarea>
      </div>

      <div class="form-group">
        <label for="materiales">Adjuntar materiales de referencia (Opcional - hasta 2 archivos)</label>
        <input type="file" id="materiales" name="materiales" multiple accept=".pdf,.docx,.txt,.md,.csv">
      </div>

      <button type="submit" id="btn-submit" class="btn-submit">Generar Material Educativo</button>
    </form>

    <div id="loader" class="loader">Generando contenido pedagógico con IA... Por favor aguardá unos segundos.</div>
    <div id="result-box" class="result-box"></div>
  </div>

  <script>
    // Gestión automática del ID de usuario local
    const USER_ID_KEY = 'edu_sistem_user_id';
    let currentUserId = localStorage.getItem(USER_ID_KEY);

    if (!currentUserId) {
      currentUserId = 'user_' + Math.random().toString(36).substring(2, 11);
      localStorage.setItem(USER_ID_KEY, currentUserId);
    }

    // Al cargar la página, verificamos si venimos de un pago exitoso
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('pagado') === 'true') {
        alert('¡Pago procesado con éxito! Tu cuenta ha sido actualizada al Plan Pro.');
        window.history.replaceState({}, document.title, window.location.pathname); // Limpia la URL
      }
      
      // Estado por defecto en UI mientras se conecta con el server
      document.getElementById('status-text').innerText = 'ID de Usuario activo | Listo para generar';
    });

    // Envío del formulario con control estricto de userId y límites
    document.getElementById('generation-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btnSubmit = document.getElementById('btn-submit');
      const loader = document.getElementById('loader');
      const resultBox = document.getElementById('result-box');
      const errorBanner = document.getElementById('error-banner');

      errorBanner.style.display = 'none';
      resultBox.style.display = 'none';
      btnSubmit.disabled = true;
      loader.style.display = 'block';

      const formData = new FormData(e.target);
      formData.append('userId', currentUserId); // Inyectamos el ID de usuario obligatorio

      try {
        const response = await fetch('/api/generar', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          // Si el servidor devuelve 403 (Límite alcanzado) o 401/500
          if (response.status === 403) {
            document.getElementById('btn-upgrade').style.display = 'inline-block';
          }
          throw new Error(data.error || 'Ocurrió un error al procesar la solicitud.');
        }

        // Mostrar resultado exitoso
        resultBox.innerText = data.texto;
        resultBox.style.display = 'block';

        // Actualizar contadores si vienen del backend
        if (data.generations_used !== undefined && data.generation_limit !== undefined) {
          document.getElementById('status-text').innerText = `Plan Activo | Usadas: ${data.generations_used} / ${data.generation_limit}`;
          if (data.generations_used >= data.generation_limit) {
            document.getElementById('btn-upgrade').style.display = 'inline-block';
          }
        }

      } catch (err) {
        errorBanner.innerText = err.message;
        errorBanner.style.display = 'block';
      } finally {
        loader.style.display = 'none';
        btnSubmit.disabled = false;
      }
    });

    // Función para iniciar el flujo de pago con Mercado Pago
    async function pagarPlanPro() {
      try {
        const btn = document.getElementById('btn-upgrade');
        btn.innerText = 'Conectando con Mercado Pago...';
        btn.disabled = true;

        const response = await fetch('/api/crear-preferencia', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: currentUserId, email: 'docente@edu.sistem.pro' })
        });

        const data = await response.json();

        if (data.ok && data.init_point) {
          window.location.href = data.init_point;
        } else {
          alert(data.error || 'No se pudo iniciar la preferencia de pago.');
          btn.innerText = '⭐ Actualizar a Pro ($5.000)';
          btn.disabled = false;
        }
      } catch (e) {
        console.error('Error de pago:', e);
        alert('No se pudo conectar con la pasarela de pagos.');
        document.getElementById('btn-upgrade').innerText = '⭐ Actualizar a Pro ($5.000)';
        document.getElementById('btn-upgrade').disabled = false;
      }
    }
  </script>
</body>
</html>
