<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edu.sistem pro ia</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#18212f}
header{background:#173b67;color:white;padding:22px 18px;text-align:center}
header h1{margin:0;font-size:28px}header p{margin:7px 0 0;opacity:.9}
main{max-width:850px;margin:22px auto;padding:0 15px}
.card{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 18px #00000012;margin-bottom:18px}
h2{margin-top:0;color:#173b67}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-weight:bold;font-size:14px;display:block;margin-bottom:5px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}
textarea{min-height:120px;resize:vertical}
.full{grid-column:1/-1}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{background:#1769aa;color:#fff}.secondary{background:#e7eef7;color:#173b67}
#resultado{white-space:pre-wrap;line-height:1.5;background:#fafafa;border:1px solid #d9e0e8;padding:16px;border-radius:10px;min-height:200px}
.small{font-size:13px;color:#667085}
@media(max-width:650px){.grid,.buttons{grid-template-columns:1fr}.full{grid-column:auto}main{margin:12px auto}.card{padding:16px}}
</style>
</head>
<body>
<header>
  <h1>Edu.sistem pro ia</h1>
  <p>Asistente inteligente para docentes</p>
</header>

<main>
<section class="card">
<h2>¿Qué querés crear?</h2>
<div class="grid">
<div>
<label>Tipo de trabajo</label>
<select id="tipo">
<option value="anual">Planificación anual</option>
<option value="secuencia">Secuencia didáctica</option>
<option value="proyecto">Proyecto</option>
<option value="rubrica">Rúbrica</option>
</select>
</div>
<div>
<label>Nivel</label>
<select id="nivel">
<option>Inicial</option><option selected>Primaria</option><option>Secundaria</option><option>Superior</option>
</select>
</div>
<div>
<label>Grado / Curso</label>
<input id="grado" placeholder="Ej.: 5.º grado">
</div>
<div>
<label>Área / Materia</label>
<input id="area" placeholder="Ej.: Lengua">
</div>
<div class="full">
<label>Tema</label>
<input id="tema" placeholder="¿Sobre qué necesitás trabajar?">
</div>
<div>
<label>Duración</label>
<input id="duracion" placeholder="Ej.: 4 semanas">
</div>
<div class="full">
<label>¿Cómo querés que lo realice?</label>
<textarea id="indicaciones" placeholder="Ej.: Necesito que tenga fundamentación, objetivos, contenidos, actividades y evaluación. Que sea sencillo y esté organizado en una tabla."></textarea>
<p class="small">Acá podés indicar el formato o las características que necesitás, sin subir modelos.</p>
</div>
</div>
<div class="buttons">
<button class="primary" onclick="generar()">Crear con IA</button>
<button class="secondary" onclick="limpiar()">Limpiar</button>
</div>
</section>

<section class="card">
<h2>Resultado</h2>
<div id="estado" class="small">Todavía no generaste un trabajo.</div>
<br>
<div id="resultado"></div>
<br>
<div class="buttons">
<button class="primary" onclick="copiar()">Copiar</button>
<button class="secondary" onclick="compartir()">Compartir</button>
</div>
</section>
</main>

<script>
async function generar(){
 const estado=document.getElementById("estado");
 const resultado=document.getElementById("resultado");
 estado.textContent="Generando...";
 resultado.textContent="";
 const data={
   tipo:document.getElementById("tipo").value,
   nivel:document.getElementById("nivel").value,
   grado:document.getElementById("grado").value,
   area:document.getElementById("area").value,
   tema:document.getElementById("tema").value,
   duracion:document.getElementById("duracion").value,
   indicaciones:document.getElementById("indicaciones").value
 };
 try{
   const r=await fetch("/api/generar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
   const j=await r.json();
   if(!r.ok) throw new Error(j.error||"No se pudo generar");
   resultado.textContent=j.texto;
   estado.textContent="Trabajo generado correctamente.";
 }catch(e){estado.textContent="Error: "+e.message}
}
async function copiar(){
 const t=document.getElementById("resultado").textContent;
 if(!t) return;
 await navigator.clipboard.writeText(t);
 document.getElementById("estado").textContent="Copiado. Ahora podés pegarlo donde quieras.";
}
async function compartir(){
 const t=document.getElementById("resultado").textContent;
 if(!t) return;
 if(navigator.share) await navigator.share({title:"Edu.sistem pro ia",text:t});
 else await copiar();
}
function limpiar(){
 ["grado","area","tema","duracion","indicaciones"].forEach(id=>document.getElementById(id).value="");
 document.getElementById("resultado").textContent="";
 document.getElementById("estado").textContent="Formulario limpio.";
}
</script>
</body>
</html>
